# Тестовая конфигурация: не тянем config-server и не регистрируемся в Eureka.
spring:
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topic: user-events
  mail:
    from: no-reply@userservice.local

eureka:
  client:
    enabled: false
